name: Bogenliga Maven CI Benchmark

on:
  push:
    branches:
      - develop
      - setup/docker-ci
      - 'fault/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker-Buildumgebung erstellen
        run: docker build --file Dockerfile.ci --tag bogenliga-ci .
      
      - name: Maven Build und Tests
        shell: bash
        run: |
          set -o pipefail
          set +e

          docker run --rm \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/workspace" \
            --workdir /workspace/bogenliga \
            --env MAVEN_OPTS="--add-opens java.base/java.lang=ALL-UNNAMED" \
            bogenliga-ci 2>&1 | tee maven.log

          build_status=${PIPESTATUS[0]}
          exit "${build_status}"


      - name: Maven-Logs und Surefire-Berichte speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-diagnostics
          path: |
            maven.log
            bogenliga/**/target/surefire-reports/**
          if-no-files-found: warn
