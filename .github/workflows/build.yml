name: Build
on: [push, pull_request]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml', 'Dockerfile') }}
          restore-keys: ${{ runner.os }}-m2-


      - name: Docker-Buildumgebung erstellen
        run: docker build --file Dockerfile --tag bogenliga-ci .
      
      - name: Maven Build und Tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$HOME/.m2/repository"
          docker run --rm \
          --mount "type=bind,source=${GITHUB_WORKSPACE},target=/workspace" \
          --mount "type=bind,source=${HOME}/.m2/repository,target=/root/.m2/repository" \
          bogenliga-ci 2>&1 | tee maven.log


      - name: Maven-Logs und Surefire-Berichte speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-diagnostics
          path: |
            maven.log
            bogenliga/**/target/surefire-reports/**
          if-no-files-found: warn
