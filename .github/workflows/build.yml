name: Bogenliga Maven CI Benchmark

on:
  push:
    branches:
      - develop
      - 'fault/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: maven
          cache-dependency-path: 'bogenliga/**/pom.xml'

      - name: Maven Build und Tests
        working-directory: ./bogenliga
        shell: bash
        run: |
          set -o pipefail
          export MAVEN_OPTS="--add-opens java.base/java.lang=ALL-UNNAMED"
          mvn -B clean verify 2>&1 | tee ../maven.log

      - name: Maven-Logs und Surefire-Berichte speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-diagnostics
          path: |
            maven.log
            bogenliga/**/target/surefire-reports/**
          if-no-files-found: warn
